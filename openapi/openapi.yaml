openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
  summary: REST API for creating and retrieving customer orders.
  description: |
    A portfolio reference contract for a small order-management service.
    It exposes operations to list orders, create an order, and retrieve an
    order by its identifier.

    The server URL uses the reserved .test domain. It is intentionally
    non-routable and must be replaced with the base URL of a deployed service.
  contact:
    name: API Documentation
servers:
  - url: https://api.example.test/v1
    description: Reserved example host for documentation and testing; not a live service.
security:
  - bearerAuth: []
tags:
  - name: Orders
    description: Create and retrieve customer orders.
paths:
  /orders:
    get:
      tags: [Orders]
      summary: List orders
      description: Returns the collection of orders visible to the authenticated caller.
      operationId: listOrders
      responses:
        '200':
          description: The order collection was returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              examples:
                orders:
                  summary: Two orders
                  value:
                    - id: 1001
                      status: pending
                    - id: 1002
                      status: shipped
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Orders]
      summary: Create an order
      description: Creates an order and returns the newly assigned order identifier.
      operationId: createOrder
      requestBody:
        required: true
        description: Order details supplied by the caller.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
            examples:
              newOrder:
                summary: Create a pending order
                value:
                  status: pending
      responses:
        '201':
          description: The order was created successfully.
          headers:
            Location:
              description: Relative URI of the newly created order.
              schema:
                type: string
                example: /v1/orders/1003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                createdOrder:
                  value:
                    id: 1003
                    status: pending
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order
      description: Returns a single order by its unique numeric identifier.
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          required: true
          description: Unique order identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1001
      responses:
        '200':
          description: The requested order was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                order:
                  value:
                    id: 1001
                    status: pending
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No order exists with the supplied identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                orderNotFound:
                  value:
                    type: https://api.example.test/problems/order-not-found
                    title: Order not found
                    status: 404
                    detail: No order was found for the supplied identifier.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Access token issued by the service. Obtain a token from the service operator.
  schemas:
    Order:
      type: object
      description: An order resource returned by the API.
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Server-assigned order identifier.
          examples: [1001]
        status:
          $ref: '#/components/schemas/OrderStatus'
      required: [id, status]
      examples:
        - id: 1001
          status: pending
    OrderInput:
      type: object
      description: Fields accepted when creating an order.
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
      required: [status]
      examples:
        - status: pending
    OrderStatus:
      type: string
      description: Current lifecycle state of the order.
      enum: [pending, shipped, delivered]
      examples: [pending]
    ProblemDetails:
      type: object
      description: Error response based on the Problem Details format (RFC 9457).
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri
          description: URI identifying this specific occurrence of the problem.
      required: [type, title, status, detail]
      examples:
        - type: https://api.example.test/problems/invalid-request
          title: Invalid request
          status: 400
          detail: The request body is missing or contains an invalid value.
  responses:
    BadRequest:
      description: The request is malformed or contains invalid input.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            invalidRequest:
              value:
                type: https://api.example.test/problems/invalid-request
                title: Invalid request
                status: 400
                detail: The request body is missing or contains an invalid value.
    Unauthorized:
      description: A valid bearer access token was not supplied.
      headers:
        WWW-Authenticate:
          description: Authentication challenge.
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            unauthorized:
              value:
                type: https://api.example.test/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: A valid bearer access token is required.
