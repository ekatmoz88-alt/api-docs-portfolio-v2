openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
  description: API for managing orders
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Developer
    email: dev@example.com
servers:
  - url: https://api.example.com/v1
    description: Demo API
security: []
paths:
  /orders:
    get:
      summary: List orders
      operationId: getOrders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              examples:
                ordersList:
                  value:
                    - id: 1
                      status: "pending"
                    - id: 2
                      status: "shipped"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unauthorized:
                  value:
                    type: "https://example.com/probs/unauthorized"
                    title: "Unauthorized"
                    status: 401
                    detail: "Authentication required."
    post:
      summary: Create order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
            examples:
              newOrder:
                value:
                  status: "pending"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                createdOrder:
                  value:
                    id: 3
                    status: "pending"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
