openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
  description: API for managing orders, demonstrating OpenAPI 3.1 and Docs-as-Code approach.
servers:
  - url: https://api.example.com/v1
paths:
  /orders:
    get:
      summary: List orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      summary: Create order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Created
components:
  schemas:
    Order:
      type: object
      properties:
        orderId:
          type: string
        status:
          type: string
