openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
  summary: Authenticated API for creating and retrieving orders.
  description: |
    A working portfolio API deployed as a Supabase Edge Function.
    Authenticated users can create orders and retrieve only the orders
    associated with their own account.

    Supply both the Supabase publishable API key in the apikey header and
    a Supabase Auth access token in the Authorization: Bearer header.
  contact:
    name: API Documentation
servers:
  - url: https://ajnslobbgvnsoyezboqa.supabase.co/functions/v1/orders-api
    description: Live Orders API Edge Function (Supabase, eu-central-1).
security:
  - apiKeyAuth: []
    bearerAuth: []
tags:
  - name: Orders
    description: Create and retrieve orders belonging to the authenticated user.
paths:
  /orders:
    get:
      tags: [Orders]
      summary: List the current user's orders
      description: Returns orders owned by the authenticated user, newest first.
      operationId: listOrders
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of orders to return (1–100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of orders to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: The order collection was returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              examples:
                orders:
                  value:
                    - id: 1001
                      status: pending
                      created_at: '2026-11-07T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Orders]
      summary: Create an order
      description: Creates an order for the authenticated user.
      operationId: createOrder
      requestBody:
        required: true
        description: New order details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
            examples:
              newOrder:
                value:
                  status: pending
      responses:
        '201':
          description: The order was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                createdOrder:
                  value:
                    id: 1003
                    status: pending
                    created_at: '2026-11-07T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get one of the current user's orders
      description: Returns an order by its numeric identifier. Users cannot retrieve another user's orders.
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          required: true
          description: Positive integer order identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1001
      responses:
        '200':
          description: The requested order was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                order:
                  value:
                    id: 1001
                    status: pending
                    created_at: '2026-11-07T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The order does not exist or is not visible to the current user.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                orderNotFound:
                  value:
                    type: urn:orders-api:problems:404
                    title: Order not found
                    status: 404
                    detail: No order was found for the supplied identifier.
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: Supabase publishable API key for this project.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token for the signed-in user.
  schemas:
    Order:
      type: object
      description: An order owned by the authenticated user.
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Server-generated order identifier.
          examples: [1001]
        status:
          $ref: '#/components/schemas/OrderStatus'
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the order was created.
      required: [id, status, created_at]
      examples:
        - id: 1001
          status: pending
          created_at: '2026-11-07T10:30:00Z'
    OrderInput:
      type: object
      description: Fields accepted when creating an order.
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
      required: [status]
      examples:
        - status: pending
    OrderStatus:
      type: string
      description: Current lifecycle state of the order.
      enum: [pending, shipped, delivered]
      examples: [pending]
    ProblemDetails:
      type: object
      description: Error response based on RFC 9457 Problem Details.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
      required: [type, title, status, detail]
  responses:
    BadRequest:
      description: The request body, query parameters, or order identifier are invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            invalidRequest:
              value:
                type: urn:orders-api:problems:400
                title: Invalid request
                status: 400
                detail: The request body or query parameters are invalid.
            invalidOrder:
              value:
                type: urn:orders-api:problems:400
                title: Invalid order
                status: 400
                detail: status is required and must be pending, shipped, or delivered. No other fields are accepted.
            invalidPagination:
              value:
                type: urn:orders-api:problems:400
                title: Invalid pagination
                status: 400
                detail: limit must be an integer from 1 to 100 and offset must be a non-negative integer.
    Unauthorized:
      description: A valid Supabase Auth access token was not supplied.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            unauthorized:
              value:
                type: urn:orders-api:problems:401
                title: Unauthorized
                status: 401
                detail: A valid Supabase Auth access token is required.
    Forbidden:
      description: The authenticated user is not allowed to create orders.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            forbidden:
              value:
                type: urn:orders-api:problems:403
                title: Forbidden
                status: 403
                detail: The authenticated user is not allowed to create orders.
    MethodNotAllowed:
      description: The HTTP method is not supported for the requested resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            methodNotAllowed:
              value:
                type: urn:orders-api:problems:405
                title: Method not allowed
                status: 405
                detail: This HTTP method is not supported for the requested resource.
    InternalServerError:
      description: The API could not complete the request because of a server-side error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            internalError:
              value:
                type: urn:orders-api:problems:500
                title: Internal server error
                status: 500
                detail: The request could not be completed.
