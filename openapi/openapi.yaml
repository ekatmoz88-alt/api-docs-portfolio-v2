openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
  description: API for managing orders
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Developer
    email: dev@example.com
servers:
  - url: https://api.example.com/v1
    description: Demo API
security: []
paths:
  /orders:
    get:
      summary: List orders
      operationId: getOrders
      x-codeSamples:
        - lang: 'cURL'
          label: 'cURL'
          source: |
            curl -X GET "https://api.example.com/v1/orders" \
              -H "Authorization: Bearer YOUR_TOKEN"
        - lang: 'Python'
          label: 'Python'
          source: |
            import requests

            response = requests.get(
                "https://api.example.com/v1/orders",
                headers={"Authorization": "Bearer YOUR_TOKEN"}
            )
            print(response.json())
        - lang: 'JavaScript'
          label: 'JavaScript'
          source: |
            fetch("https://api.example.com/v1/orders", {
              headers: { "Authorization": "Bearer YOUR_TOKEN" }
            })
              .then(response => response.json())
              .then(data => console.log(data));
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              examples:
                listOrders:
                  value:
                    - id: 1
                      status: "pending"
                    - id: 2
                      status: "shipped"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                badRequest:
                  value:
                    type: "https://example.com/probs/bad-request"
                    title: "Bad Request"
                    status: 400
                    detail: "Invalid query parameters."
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unauthorized:
                  value:
                    type: "https://example.com/probs/unauthorized"
                    title: "Unauthorized"
                    status: 401
                    detail: "Authentication required."
    post:
      summary: Create order
      operationId: createOrder
      x-codeSamples:
        - lang: 'cURL'
          label: 'cURL'
          source: |
            curl -X POST "https://api.example.com/v1/orders" \
              -H "Authorization: Bearer YOUR_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"status": "pending"}'
        - lang: 'Python'
          label: 'Python'
          source: |
            import requests

            response = requests.post(
                "https://api.example.com/v1/orders",
                headers={"Authorization": "Bearer YOUR_TOKEN"},
                json={"status": "pending"}
            )
            print(response.status_code)
            print(response.json())
        - lang: 'JavaScript'
          label: 'JavaScript'
          source: |
            fetch("https://api.example.com/v1/orders", {
              method: "POST",
              headers: {
                "Authorization": "Bearer YOUR_TOKEN",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ status: "pending" })
            })
              .then(response => response.json())
              .then(data => console.log(data));
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                createdOrder:
                  value:
                    id: 3
                    status: "pending"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, shipped, delivered]
      required:
        - id
        - status
    OrderInput:
      type: object
      properties:
        status:
          type: string
          enum: [pending, shipped, delivered]
      required:
        - status
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
      required:
        - type
        - title
        - status
        - detail
