name: Lint OpenAPI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Redocly CLI
        run: npm install -g @redocly/cli
        
      - name: Lint OpenAPI spec
        run: redocly lint openapi/openapi.yaml
