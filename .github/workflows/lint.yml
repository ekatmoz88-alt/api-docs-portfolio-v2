name: API Contract Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  spectral-lint:
    name: Execute Spectral Linter Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v5

      - name: Run Spectral OpenApi Validations
        uses: stoplightio/spectral-action@v0.8.2
        with:
          file_glob: 'openapi/navigation-api.yaml'

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: spectral-lint
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy Production Artifact
        id: deployment
        uses: actions/deploy-pages@v4
